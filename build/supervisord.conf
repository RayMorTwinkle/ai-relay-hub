; ============================================================================
; ai-relay-hub 进程编排（单容器 4 服务 + 1 常驻接线器）
; 端口布局（全部仅容器内/回环互调，对外只发布 AGG_PORT 与 WB 面板）：
;   wb-proxy    0.0.0.0:8788   OpenAI /v1 + Anthropic + Responses（面板发布回环）
;   qoder-proxy 127.0.0.1:3000 /v1 + /v1/messages   （上游强制 loopback，勿改）
;   oc-gate     0.0.0.0:13339  /openai/v1 + /anthropic/v1 + /codex/v1
;   new-api     0.0.0.0:8080   ← 唯一对外出口
;   wirer       常驻：探活 → 拉模型 → 写 new-api 渠道（前缀路由）
; ============================================================================

[supervisord]
nodaemon=true
logfile=/data/logs/supervisord.log
pidfile=/run/supervisord.pid
loglevel=info

; ---------- 上游 1：WorkBuddy（国际版/国内版多账号网关）----------
; --lan 隐含 --host 0.0.0.0 并强制 API Key；accounts/usage 显式落到 /data 持久化卷
[program:wb-proxy]
command=python /app/wb_proxy.py --lan --port %(ENV_WB_PORT)s --api-key %(ENV_WB_API_KEY)s --accounts-dir /data/accounts --usage-dir /data/usage
directory=/app
priority=10
autorestart=true
stdout_logfile=/data/logs/wb-proxy.log
stderr_logfile=/data/logs/wb-proxy.log
environment=HOST="0.0.0.0",PORT="%(ENV_WB_PORT)s",API_KEY="%(ENV_WB_API_KEY)s",ACCOUNTS_DIR="/data/accounts",TZ="%(ENV_TZ)s"

; ---------- 上游 2：Qoder（仅 CN 后端，CLI 子进程模型）----------
[program:qoder-proxy]
command=node clean/server.js
directory=/opt/qoder
priority=10
autorestart=true
stdout_logfile=/data/logs/qoder.log
stderr_logfile=/data/logs/qoder.log
environment=PORT="%(ENV_QODER_PORT)s",CLI_BACKEND="cn",PROXY_API_KEY="%(ENV_QODER_API_KEY)s",QODERCN_PERSONAL_ACCESS_TOKEN="%(ENV_QODERCN_PAT)s"

; ---------- 上游 3：OpenCode free-gate（公共代理池，免账号）----------
[program:oc-gate]
command=/opt/ocgate/gate
priority=10
autorestart=true
stdout_logfile=/data/logs/oc-gate.log
stderr_logfile=/data/logs/oc-gate.log
environment=PORT="%(ENV_OC_PORT)s",PROXY_MODE="%(ENV_OC_PROXY_MODE)s"

; ---------- 聚合层：new-api（唯一对外出口）----------
; 端口走 PORT env；SQLite 落 /data/new-api.db（SQLITE_PATH）
[program:new-api]
command=/opt/agg/new-api
directory=/data
priority=20
autorestart=true
stdout_logfile=/data/logs/new-api.log
stderr_logfile=/data/logs/new-api.log
environment=PORT="%(ENV_AGG_PORT)s",SESSION_SECRET="%(ENV_SESSION_SECRET)s",SQLITE_PATH="/data/new-api.db",TZ="%(ENV_TZ)s"

; ---------- 常驻接线器：把三上游聚合成一个出口 ----------
[program:wirer]
command=python3 /opt/hub/wire.py
priority=30
autorestart=false
exitcodes=0,2
stdout_logfile=/data/logs/wirer.log
stderr_logfile=/data/logs/wirer.log
environment=WB_BASE="http://127.0.0.1:%(ENV_WB_PORT)s",QODER_BASE="http://127.0.0.1:%(ENV_QODER_PORT)s",OC_BASE="http://127.0.0.1:%(ENV_OC_PORT)s",AGG_BASE="http://127.0.0.1:%(ENV_AGG_PORT)s",AGG_ADMIN_USER="%(ENV_AGG_ADMIN_USER)s",AGG_ADMIN_PASS="%(ENV_AGG_ADMIN_PASS)s",SYSTEM_ACCESS_TOKEN="%(ENV_SYSTEM_ACCESS_TOKEN)s",WB_API_KEY="%(ENV_WB_API_KEY)s",WB_API_KEY_INTL="%(ENV_WB_API_KEY_INTL)s",WB_API_KEY_CN="%(ENV_WB_API_KEY_CN)s",QODER_API_KEY="%(ENV_QODER_API_KEY)s",WIRER_INTERVAL="%(ENV_WIRER_INTERVAL)s",WIRER_BOOT_WAIT="%(ENV_WIRER_BOOT_WAIT)s"
